schema: 1
triggers:
  - observe: "entropy > 7.0, imports < 5"
    hypothesis: "样本加壳"
    test: "detect_packer / upx -d"
    ref: "toolbox/patterns.md"
  - observe: "section names UPX0/UPX1"
    hypothesis: "UPX 壳"
    test: "upx -d sample -o unpacked"
    ref: "toolbox/patterns.md"
  - observe: "imports: CreateRemoteThread, WriteProcessMemory"
    hypothesis: "进程注入器"
    test: "objdump -d → 跟踪调用链"
    ref: "native/pe-loader-dll-injection.md"
  - observe: "DEX 调用 native .so"
    hypothesis: "Android + JNI"
    test: "apk_fingerprint"
    ref: "android/index.md"
  - observe: "API 返回对象 ID 可遍历"
    hypothesis: "IDOR"
    test: "多身份差分（shell curl）"
    ref: "web/idor.md"
  - observe: "JWT 无签名验证"
    hypothesis: "JWT 绕过"
    test: "篡改 payload 重发"
    ref: "web/jwt-attack.md"
