schema: 1
triggers:
  - observe: "entropy > 7.0, imports < 5"
    hypothesis: "可能存在压缩/加密资源或加载期变换；未确认壳"
    test: "使用专业分析器取候选信号并保存原始输出；检查入口与实际加载映射，确认本构建匹配后才在副本测试对应工具"
    ref: "native/protection-detection-methodology.md"
  - observe: "section names UPX0/UPX1"
    hypothesis: "UPX 候选，节名可能伪造"
    test: "验证头、段/块边界和入口；匹配后才在副本上测试解包，结构与行为分级验收"
    ref: "native/packer-handling.md"
  - observe: "imports: CreateRemoteThread, WriteProcessMemory"
    hypothesis: "进程注入器"
    test: "objdump -d → 跟踪调用链"
    ref: "native/pe-loader-dll-injection.md"
  - observe: "DEX 调用 native .so"
    hypothesis: "Android + JNI"
    test: "使用 jadx/apktool 检查 DEX/JNI 边界并保存原始输出"
    ref: "android/index.md"
  - observe: "API 返回对象 ID 可遍历"
    hypothesis: "IDOR"
    test: "多身份差分（shell curl）"
    ref: "web/idor.md"
  - observe: "JWT 无签名验证"
    hypothesis: "JWT 绕过"
    test: "篡改 payload 重发"
    ref: "web/jwt-attack.md"
