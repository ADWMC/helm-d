name: 🐞 缺陷报告
description: 插件行为异常、工具调用失败、宿主兼容问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先自查：

        1. 安装类问题先看 [安装故障排查](https://github.com/ADWMC/helm-d/blob/main/docs/install-troubleshooting.md)；
        2. 日志、路径、样本名、主机名请**脱敏**后再贴；
        3. 本项目仅限自有资产或已授权范围，使用边界见 [DISCLAIMER](https://github.com/ADWMC/helm-d/blob/main/DISCLAIMER.md)。

  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      description: README 徽章或 packages/helmd/package.json 的 version
      placeholder: 0.5.3
    validations:
      required: true

  - type: input
    id: dsh-version
    attributes:
      label: dsh 版本
      description: dsh --version 的输出
      placeholder: 0.2.1-rc.2
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Windows（pwsh）
        - Linux（bash）
        - macOS（bash）
        - WSL（wsl.exe）
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node 版本
      placeholder: "22.19.0"
    validations:
      required: true

  - type: dropdown
    id: when
    attributes:
      label: 出现时机
      options:
        - 首次安装后立即出现
        - 升级 / 重装后出现
        - 偶发（无法稳定复现）
        - 一直存在
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开会话开始写，包含输入与触发的工具名
      placeholder: |
        1. 新建会话，预设切到 helmd
        2. 发送 "helmd"
        3. 调用 begin_case ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果 vs 实际结果
      placeholder: |
        期望：...
        实际：...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 报错（已脱敏）
      description: 贴关键片段即可；不要贴 token、cookie、真实主机或客户信息
      render: shell
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 受影响区域
      multiple: true
      options:
        - 安装 / 预设 / 档位
        - 工具调用（34 个工具）
        - Case 与证据链
        - 工作台 / API
        - Team 协作
        - 文档 / 参考
        - 其它
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已检索现有 issue，没有重复
          required: true
        - label: 我已移除凭据、真实主机与客户信息
          required: true
